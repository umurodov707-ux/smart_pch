# ==================================================
# SMART PCH — Nginx Reverse Proxy (PRODUCTION)
# ==================================================
# Bu faylni /etc/nginx/sites-available/smartpch ga joylashtiring
# va symlink yarating:
#   sudo ln -sf /etc/nginx/sites-available/smartpch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==================================================

# HTTP → HTTPS yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name smartpch.uz www.smartpch.uz;

    # Let's Encrypt ACME tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Qolgan hamma narsa → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Asosiy HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartpch.uz www.smartpch.uz;

    # ---- SSL sertifikatlar (Certbot tomonidan avtomatik boshqariladi) ----
    ssl_certificate     /etc/letsencrypt/live/smartpch.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpch.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Xavfsizlik headerlari ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- Gzip siqish (tezlik uchun) ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # ---- Upload hajmi (25 MB gacha) ----
    client_max_body_size 25M;

    # ---- Asosiy proxy — Node.js serveri ----
    location / {
        proxy_pass http://127.0.0.1:6878;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Asl mijoz IP va boshqa ma'lumotlar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeoutlar
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Socket.IO alohida location (uzoq ulanishlar uchun) ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:6878/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket heartbeat uchun — 24 soat
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Statik fayllar uchun kesh (Vite hashed fayllar) ----
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://127.0.0.1:6878;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Service Worker faylini keshlamaslik ----
    location = /sw.js {
        proxy_pass http://127.0.0.1:6878;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- manifest.json ni keshlamaslik ----
    location = /manifest.json {
        proxy_pass http://127.0.0.1:6878;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
