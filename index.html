<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="SMART PCH — O'zbekiston Temir Yo'llari dispetcherlik, ishlab chiqarish va xavfsizlik boshqaruv tizimi." />
    <title>SMART PCH - O'zbekiston Temir Yo'llari</title>

    <!-- PWA — Mobil qurilmalarda ilova sifatida ishlash uchun -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartPCH" />
    <link rel="apple-touch-icon" href="/img/logo.png" />

    <!-- Mobilda telefon raqamlarni avtomatik linklamaslik uchun -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Inter shrifti -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />

    <!-- Mavzuni sahifa chizilishidan oldin qo'yish (oq-qora miltillash bo'lmasligi uchun) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('smartpch-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!-- FontAwesome: hali ko'chirilmagan sahifalar uchun (yangi komponentlar lucide-react ishlatadi) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
