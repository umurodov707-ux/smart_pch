version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-pch-db
    restart: always
    environment:
      POSTGRES_USER: smart_user
      POSTGRES_PASSWORD: smart_password
      POSTGRES_DB: smart_pch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
